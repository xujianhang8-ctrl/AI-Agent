<title>Next Move Property Advisor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen app. Header + tabs, then either the chat thread or the quick-check form/results. */
:root {
  --bg: #f3f6f5; --surface: #ffffff; --ink: #14232a; --muted: #5a6b70; --line: #d9e2e0;
  --accent: #0d6b5a; --accent-ink: #ffffff; --accent-soft: #e0efeb;
  --ok: #1d7a46; --warn: #a8670c; --bad: #b2382f;
  --ok-soft: #e3f3e9; --warn-soft: #fbf0dc; --bad-soft: #f9e4e2;
  --user-bubble: #14232a; --user-ink: #f3f6f5;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f181b; --surface: #16232a; --ink: #e6eeec; --muted: #93a6a8; --line: #2a3a40;
  --accent: #4fc2a6; --accent-ink: #0b1a17; --accent-soft: #1c3631;
  --ok: #5fcf8c; --warn: #e6a64a; --bad: #f0857a;
  --ok-soft: #173326; --warn-soft: #3a2c14; --bad-soft: #3d1f1c;
  --user-bubble: #e6eeec; --user-ink: #0f181b; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f181b; --surface: #16232a; --ink: #e6eeec; --muted: #93a6a8; --line: #2a3a40;
  --accent: #4fc2a6; --accent-ink: #0b1a17; --accent-soft: #1c3631;
  --ok: #5fcf8c; --warn: #e6a64a; --bad: #f0857a;
  --ok-soft: #173326; --warn-soft: #3a2c14; --bad-soft: #3d1f1c;
  --user-bubble: #e6eeec; --user-ink: #0f181b; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
.app { height: 100%; display: flex; flex-direction: column; max-width: 860px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { padding-block: 14px 10px; display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px; }
h1 { font: 700 1.45rem/1.1 var(--display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h1 span { color: var(--accent); }
.sub { color: var(--muted); font-size: 0.85rem; margin: 2px 0 0; }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.tabs button { border: 0; background: transparent; color: var(--muted); font: 600 0.85rem var(--body); padding: 6px 14px; border-radius: 999px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.thread { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-block: 8px 16px; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: 16px; line-height: 1.55; overflow-wrap: anywhere; }
.msg.bot { background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; align-self: flex-start; }
.msg.user { background: var(--user-bubble); color: var(--user-ink); border-bottom-right-radius: 4px; align-self: flex-end; white-space: pre-wrap; }
.msg p { margin: 0 0 8px; } .msg p:last-child { margin-bottom: 0; }
.msg ul { margin: 4px 0 8px; padding-left: 20px; } .msg li { margin: 2px 0; }
.msg h4 { font: 600 0.95rem var(--display); margin: 10px 0 4px; }
.status { font-size: 0.8rem; color: var(--muted); align-self: flex-start; display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite alternate; }
@keyframes pulse { from { opacity: .3 } to { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: 500 0.82rem var(--body); cursor: pointer; text-align: left; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.composer { display: flex; gap: 8px; padding-block: 10px 14px; border-top: 1px solid var(--line); }
.composer textarea { flex: 1; min-width: 0; resize: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 10px 12px; font: 15px/1.4 var(--body); max-height: 140px; }
.btn { border: 0; border-radius: 12px; padding: 0 18px; font: 600 0.9rem var(--body); cursor: pointer; background: var(--accent); color: var(--accent-ink); min-height: 44px; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn:disabled { opacity: .5; cursor: default; }
.notice { background: var(--warn-soft); color: var(--ink); border-radius: 12px; padding: 10px 14px; font-size: 0.88rem; }

/* Quick check */
.quick { flex: 1; min-height: 0; overflow-y: auto; padding-block: 4px 24px; display: grid; gap: 18px; }
form.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
form.grid fieldset { grid-column: 1 / -1; border: 0; padding: 0; margin: 4px 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px 14px; }
form.grid legend { font: 600 0.75rem var(--body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 0; margin-bottom: 6px; }
label { display: grid; gap: 4px; font-size: 0.8rem; color: var(--muted); }
input, select { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 8px 10px; font: 0.95rem var(--body); min-width: 0; }
input[type="number"] { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.example-tag { grid-column: 1 / -1; font-size: 0.8rem; color: var(--muted); }
.results { display: grid; gap: 10px; }
.summary { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 0.88rem; color: var(--muted); }
.summary b { color: var(--ink); font-family: var(--mono); font-weight: 500; }
.option { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 6px; }
.option.top { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.opt-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.opt-head h3 { font: 600 1.05rem var(--display); margin: 0; flex: 1; min-width: 160px; }
.score { font: 500 0.95rem var(--mono); }
.meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.pill { font-size: 0.72rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.05em; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
.figs { font-size: 0.88rem; } .figs b { font-family: var(--mono); font-weight: 500; }
.reasons { margin: 0; padding-left: 18px; font-size: 0.85rem; color: var(--muted); }
.reasons li.block { color: var(--bad); }
.disclaimer { font-size: 0.78rem; color: var(--muted); }
</style>

<div class="app">
  <header>
    <div>
      <h1>Next <span>Move</span></h1>
      <p class="sub">HDB · EC · Condo · Landed: find what fits your budget and eligibility</p>
    </div>
    <div class="tabs" role="tablist">
      <button id="tab-chat" role="tab" aria-selected="true">Chat</button>
      <button id="tab-quick" role="tab" aria-selected="false">Quick check</button>
    </div>
  </header>

  <section id="panel-chat" class="panel">
    <div id="thread" class="thread" aria-live="polite"></div>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Tell me about yourself, e.g. SC couple, 34, earning $13k…"></textarea>
      <button id="send" class="btn">Send</button>
      <button id="stop" class="btn ghost" hidden>Stop</button>
    </div>
  </section>

  <section id="panel-quick" class="panel" hidden>
    <div class="quick">
      <form id="qform" class="grid">
        <p class="example-tag">Pre-filled with an example client. Change any field to see the results update.</p>
        <label>Main buyer<select id="f-res"><option value="SC">Singapore Citizen</option><option value="PR">PR</option><option value="FOREIGNER">Foreigner</option></select></label>
        <label>Co-buyer<select id="f-co"><option value="">None (buying alone)</option><option value="SC">Singapore Citizen</option><option value="PR">PR</option><option value="FOREIGNER">Foreigner</option></select></label>
        <label>Relationship<select id="f-hh"><option value="married_couple">Married couple</option><option value="other_joint">Other joint buyers</option><option value="single">Single</option></select></label>
        <label>Age (main buyer)<input id="f-age" type="number" min="21" max="99" value="35"></label>
        <label>Household income / month (S$)<input id="f-inc" type="number" min="0" step="500" value="14500"></label>
        <label>Other debt / month (S$)<input id="f-debt" type="number" min="0" step="100" value="0"></label>
        <label>CPF OA combined (S$)<input id="f-cpf" type="number" min="0" step="1000" value="120000"></label>
        <label>Cash for purchase (S$)<input id="f-cash" type="number" min="0" step="1000" value="80000"></label>
        <label>Purpose<select id="f-purpose"><option value="own_stay">Own stay</option><option value="investment">Investment</option></select></label>
        <label>Timeline<select id="f-time"><option value="flexible">Flexible</option><option value="immediate">Need to move soon</option></select></label>
        <fieldset>
          <legend>Current property</legend>
          <label>Type<select id="f-ptype"><option value="">Don't own one</option><option value="HDB" selected>HDB</option><option value="EC">EC</option><option value="PRIVATE">Private condo</option><option value="LANDED">Landed</option></select></label>
          <label>Plan<select id="f-plan"><option value="sell">Sell it</option><option value="keep">Keep it</option></select></label>
          <label>Estimated value (S$)<input id="f-val" type="number" min="0" step="10000" value="650000"></label>
          <label>Outstanding loan (S$)<input id="f-loan" type="number" min="0" step="1000" value="180000"></label>
          <label>CPF used incl. interest (S$)<input id="f-cpfused" type="number" min="0" step="1000" value="210000"></label>
          <label>Years owned<input id="f-years" type="number" min="0" step="0.5" value="6"></label>
        </fieldset>
      </form>
      <div id="results" class="results"></div>
    </div>
  </section>
</div>

<script>
/* ================= Rules (mirror of property_agent/rules.py) ================= */
const R = {
  POLICY_AS_OF: "2026-10",
  BSD_TIERS: [[180000,.01],[180000,.02],[640000,.03],[500000,.04],[1500000,.05],[Infinity,.06]],
  ABSD: { SC:{1:0,2:.2,3:.3}, PR:{1:.05,2:.3,3:.35}, FOREIGNER:{1:.6,2:.6,3:.6} },
  TDSR:.55, MSR:.30, STRESS:.04, HDB_RATE:.026,
  BANK_LTV:{1:.75,2:.45,3:.35}, BANK_MIN_CASH:{1:.05,2:.25,3:.25},
  HDB_LTV:.75, HDB_INC_CEIL:14000, HDB_INC_CEIL_SINGLE:7000,
  TENURE_BANK:30, TENURE_HDB:25, END_AGE:65,
  EC_CEIL:16000, MOP:5, PRIV_TO_HDB_M:15, PRIV_TO_EC_M:30, SINGLE_MIN_AGE:35,
  FEES:5000, SELL_COST:.02, MARKET_RATE:.028,
  BANDS: {
    HDB_RESALE:{entry:450000,typical:700000,note:"3-room from ~$450k; 4-room ~$600k-$900k; 5-room ~$700k-$1.1M"},
    EC_NEW_LAUNCH:{entry:1300000,typical:1600000,note:"~$1,700-$1,900 psf; 3BR ~$1.5M-$1.7M, 4BR ~$1.9M+"},
    PRIVATE_RESALE:{entry:900000,typical:1500000,note:"OCR 2-3BR ~$1.2M-$1.8M; older/smaller units from ~$900k"},
    PRIVATE_NEW_LAUNCH:{entry:1200000,typical:1900000,note:"OCR ~$2,200-$2,500 psf; 2BR ~$1.4M, 3BR ~$2.0M+"},
    LANDED:{entry:2800000,typical:4000000,note:"Leasehold terrace from ~$2.8M; freehold terrace ~$3.5M-$5M; semi-D $5M+"},
  },
};
const LABELS = { HDB_RESALE:"HDB Resale", EC_NEW_LAUNCH:"New Launch EC", PRIVATE_RESALE:"Resale Private Condo", PRIVATE_NEW_LAUNCH:"New Launch Private Condo", LANDED:"Landed" };

/* ================= Profile ================= */
const RES_ALIAS = { SINGAPOREAN:"SC", CITIZEN:"SC", SG:"SC", "SINGAPORE CITIZEN":"SC", "PERMANENT RESIDENT":"PR", SPR:"PR", FOREIGN:"FOREIGNER", OTHER:"FOREIGNER" };
function res(v, name) {
  if (v == null || v === "") return null;
  let s = String(v).trim().toUpperCase(); s = RES_ALIAS[s] || s;
  if (!["SC","PR","FOREIGNER"].includes(s)) throw new Error(`${name} must be SC, PR or FOREIGNER`);
  return s;
}
function num(v, name, def = 0) {
  if (v == null || v === "") return def;
  const n = Number(String(v).replace(/[,$]/g, ""));
  if (!isFinite(n) || n < 0) throw new Error(`${name} must be a non-negative number`);
  return n;
}
function pick(v, opts, name, def) {
  if (v == null || v === "") return def;
  const s = String(v).trim().toLowerCase();
  if (!opts.includes(s)) throw new Error(`${name} must be one of ${opts.join(", ")}`);
  return s;
}
function makeProfile(d) {
  for (const k of ["residency","age","monthly_income"]) if (d[k] == null || d[k] === "") throw new Error(`missing required field: ${k}`);
  const age = Math.round(num(d.age, "age"));
  if (age < 21 || age > 99) throw new Error("age must be between 21 and 99");
  let household = pick(d.household_type, ["single","married_couple","other_joint"], "household_type", "single");
  const co = res(d.co_applicant_residency, "co_applicant_residency");
  if (household === "single" && co) household = "other_joint";
  let cp = null;
  if (d.current_property && d.current_property.type) {
    const c = d.current_property, t = String(c.type).toUpperCase();
    if (!["HDB","EC","PRIVATE","LANDED"].includes(t)) throw new Error("current_property.type must be HDB, EC, PRIVATE or LANDED");
    cp = { type:t, value:num(c.estimated_value,"estimated_value"), loan:num(c.outstanding_loan,"outstanding_loan"),
           cpfUsed:num(c.cpf_used_with_interest,"cpf_used_with_interest"), years:num(c.years_owned,"years_owned"),
           plan:pick(c.plan,["sell","keep"],"plan","sell") };
  }
  const p = {
    residency: res(d.residency, "residency"), co, household, age,
    income: num(d.monthly_income, "monthly_income"), debt: num(d.existing_monthly_debt, "existing_monthly_debt"),
    cpf: num(d.cpf_oa_balance, "cpf_oa_balance"), cash: num(d.cash_savings, "cash_savings"), cp,
    others: Math.round(num(d.other_properties_count, "other_properties_count")),
    purpose: pick(d.purpose, ["own_stay","investment"], "purpose", "own_stay"),
    timeline: pick(d.timeline, ["immediate","flexible"], "timeline", "flexible"),
    sinceDisposed: d.years_since_disposed_private == null || d.years_since_disposed_private === "" ? null : num(d.years_since_disposed_private, "years_since_disposed_private"),
  };
  p.buyers = [p.residency, p.co].filter(Boolean);
  p.hasSC = p.buyers.includes("SC");
  p.isFamily = (p.household === "married_couple" || p.household === "other_joint") && p.buyers.length >= 2;
  p.keeps = !!cp && cp.plan === "keep";
  p.sells = !!cp && cp.plan === "sell";
  p.ownsPrivate = (!!cp && (cp.type === "PRIVATE" || cp.type === "LANDED")) || p.others > 0;
  const order = { SC:0, PR:1, FOREIGNER:2 };
  p.absdRes = (p.household === "married_couple" && p.hasSC) ? "SC" : p.buyers.reduce((a, b) => order[b] > order[a] ? b : a);
  p.propsAfter = Math.min(p.others + (p.keeps ? 1 : 0) + 1, 3);
  p.loansAfter = Math.min((p.keeps && cp.loan > 0 ? 1 : 0) + 1, 3);
  return p;
}

/* ================= Calculator ================= */
function bsd(price) { let d = 0, rem = price; for (const [size, rate] of R.BSD_TIERS) { const part = Math.min(rem, size); d += part * rate; rem -= part; if (rem <= 0) break; } return d; }
const absdRate = (r, n) => R.ABSD[r][Math.min(Math.max(n, 1), 3)];
function instalment(loan, rate, yrs) { if (loan <= 0) return 0; const r = rate / 12, n = yrs * 12; return loan * r / (1 - Math.pow(1 + r, -n)); }
function loanFrom(inst, rate, yrs) { if (inst <= 0) return 0; const r = rate / 12, n = yrs * 12; return inst * (1 - Math.pow(1 + r, -n)) / r; }
function funds(p) {
  let cpf = p.cpf, cash = p.cash, proceeds = 0, refund = 0;
  if (p.cp && p.cp.plan === "sell") {
    const gross = p.cp.value * (1 - R.SELL_COST) - p.cp.loan;
    proceeds = Math.max(gross - p.cp.cpfUsed, 0);
    refund = Math.min(p.cp.cpfUsed, Math.max(gross, 0));
  }
  return { cpf: cpf + refund, cash: cash + proceeds, sale_cash_proceeds: proceeds, cpf_refund_from_sale: refund };
}
const hdbLoanOk = p => p.hasSC && p.income <= (p.isFamily ? R.HDB_INC_CEIL : R.HDB_INC_CEIL_SINGLE) && !p.ownsPrivate;
function financing(p, seg) {
  const msr = seg === "HDB_RESALE" || seg === "EC_NEW_LAUNCH";
  const tenure = Math.max(5, Math.min(R.TENURE_BANK, R.END_AGE - p.age));
  const opts = [{ name:"bank", ltv:R.BANK_LTV[p.loansAfter], minCash:R.BANK_MIN_CASH[p.loansAfter], tenure, rate:R.STRESS, msr }];
  if (seg === "HDB_RESALE" && hdbLoanOk(p)) opts.push({ name:"hdb_loan", ltv:R.HDB_LTV, minCash:0, tenure:Math.max(5, Math.min(R.TENURE_HDB, R.END_AGE - p.age)), rate:R.HDB_RATE, msr:true });
  return opts;
}
function maxLoanByIncome(p, f) {
  let room = p.income * R.TDSR - p.debt;
  if (f.msr) room = Math.min(room, p.income * R.MSR);
  return loanFrom(Math.max(room, 0), f.rate, f.tenure);
}
function check(price, p, f, fu, incLoan) {
  const loan = Math.min(price * f.ltv, incLoan), b = bsd(price), a = price * absdRate(p.absdRes, p.propsAfter);
  if (fu.cash < price * f.minCash) return [false, "minimum cash downpayment", loan, b, a];
  if (fu.cash + fu.cpf < price - loan + b + a + R.FEES) return [false, loan < price * f.ltv ? "loan limit (income / TDSR-MSR)" : "downpayment + stamp duties (cash/CPF)", loan, b, a];
  return [true, "", loan, b, a];
}
function maxPrice(p, seg, fu) {
  let best = null;
  for (const f of financing(p, seg)) {
    const incLoan = maxLoanByIncome(p, f);
    let lo = 0, hi = 2e7, why = "funds";
    for (let i = 0; i < 60; i++) { const mid = (lo + hi) / 2; const c = check(mid, p, f, fu, incLoan); if (c[0]) lo = mid; else { hi = mid; why = c[1]; } }
    const price = Math.round(lo / 1000) * 1000; const c = check(price, p, f, fu, incLoan);
    const r = { max_price:price, financing:f.name, loan_amount:Math.round(c[2]), max_loan_by_income:Math.round(incLoan), ltv:f.ltv, tenure_years:f.tenure,
                bsd:Math.round(c[3]), absd:Math.round(c[4]), absd_rate:absdRate(p.absdRes, p.propsAfter), binding_constraint:why };
    if (!best || r.max_price > best.max_price) best = r;
  }
  return best;
}
function stampDuty(price, residency, count) {
  const b = bsd(price), rate = absdRate(residency, count);
  return { price:Math.round(price), residency, property_count_after_purchase:count, bsd:Math.round(b), absd_rate:rate, absd:Math.round(price * rate), total_stamp_duty:Math.round(b + price * rate), policy_as_of:R.POLICY_AS_OF };
}

/* ================= Eligibility & scoring (mirror of advisor.py) ================= */
function E() { return { status:"eligible", reasons:[], notes:[],
  block(r) { this.status = "not_eligible"; this.reasons.push(r); },
  cond(r) { if (this.status !== "not_eligible") this.status = "conditional"; this.reasons.push(r); } }; }
function mop(p, e) { const c = p.cp; if (c && (c.type === "HDB" || c.type === "EC") && c.years < R.MOP) e.cond(`Current ${c.type} has not met the ${R.MOP}-year MOP (~${(R.MOP - c.years).toFixed(1)} more years), so it can't be sold and private can't be bought until then.`); }
const CHECKS = {
  HDB_RESALE(p) { const e = E(), c = p.cp;
    if (!p.hasSC) { if (p.residency === "PR" && p.co === "PR" && p.isFamily) e.cond("PR households need both owners to have held PR for at least 3 years; no CPF housing grants for PR-PR households."); else e.block("HDB flats need at least one Singapore Citizen buyer (or a PR-PR family). Foreigners and single PRs cannot buy HDB."); }
    if (p.hasSC && !p.isFamily && p.age < R.SINGLE_MIN_AGE) e.block(`Singles must be at least ${R.SINGLE_MIN_AGE} to buy an HDB resale flat.`);
    if (p.purpose === "investment") e.block("HDB flats must be owner-occupied, so they don't work as an investment purchase.");
    if (p.keeps) e.block("Can't keep the current property and buy an HDB flat. HDB buyers may own only one HDB and no private property.");
    if (p.ownsPrivate && !p.sells) e.block("Owners of private property must sell it before buying HDB.");
    if (c && (c.type === "PRIVATE" || c.type === "LANDED") && c.plan === "sell") e.cond(`After selling private property there is a ${R.PRIV_TO_HDB_M}-month wait before buying a resale HDB (seniors 55+ buying a 4-room or smaller are exempt).`);
    if (p.sinceDisposed != null && p.sinceDisposed * 12 < R.PRIV_TO_HDB_M) e.cond(`Private property sold less than ${R.PRIV_TO_HDB_M} months ago, so the wait-out applies.`);
    if (c && (c.type === "HDB" || c.type === "EC")) mop(p, e);
    if (p.hasSC && p.income <= R.HDB_INC_CEIL) e.notes.push("May qualify for CPF Housing Grants. Check the HDB Flat Eligibility letter.");
    return e; },
  EC_NEW_LAUNCH(p) { const e = E(), c = p.cp;
    if (!p.hasSC) e.block("New ECs need at least one Singapore Citizen buyer.");
    else if (!p.isFamily) e.block("Singles can't buy new-launch ECs (only resale ECs after 10 years).");
    else if (p.buyers.includes("FOREIGNER")) e.block("New EC co-buyers must be Singapore Citizens or PRs.");
    if (p.income > R.EC_CEIL) e.block(`Household income $${fmt(p.income)} is above the EC ceiling of $${fmt(R.EC_CEIL)}/month.`);
    if (p.purpose === "investment") e.block("ECs have a 5-year MOP with owner-occupation, so they don't work as an investment purchase.");
    if (p.ownsPrivate) e.block(`Buyers can't own private property, or have sold one in the last ${R.PRIV_TO_EC_M} months, to buy a new EC.`);
    else if (p.sinceDisposed != null && p.sinceDisposed * 12 < R.PRIV_TO_EC_M) e.block(`Private property sold less than ${R.PRIV_TO_EC_M} months ago.`);
    if (c && (c.type === "HDB" || c.type === "EC")) { mop(p, e);
      e.cond(`Must sell the current ${c.type} within 6 months of collecting the EC keys. ABSD is paid upfront and refunded on sale (married SC couples).`);
      e.notes.push("Can keep living in the current flat during the ~3-4 years of EC construction."); }
    if (p.hasSC && p.income <= 12000) e.notes.push("Income at or below $12,000 may qualify for the CPF Housing Grant for ECs.");
    return e; },
  PRIVATE_RESALE(p) { const e = E(); priv(p, e); return e; },
  PRIVATE_NEW_LAUNCH(p) { const e = E(); priv(p, e);
    e.notes.push("Progressive payments: the loan is drawn in stages during construction (~3-4 years to TOP).");
    if (p.sells && p.household === "married_couple" && p.hasSC) e.notes.push("Married SC couples can buy first and get second-property ABSD back if they sell the current home within 6 months of TOP.");
    return e; },
  LANDED(p) { const e = E(), c = p.cp;
    if (p.buyers.includes("FOREIGNER")) e.block("Foreigners can't buy landed homes on the mainland (Sentosa Cove only, with SLA approval).");
    else if (p.buyers.includes("PR") && !p.hasSC) e.cond("PRs need approval from SLA's Land Dealings Approval Unit to buy landed, usually one home for own stay under strict criteria.");
    if (c && (c.type === "HDB" || c.type === "EC")) mop(p, e);
    return e; },
};
function priv(p, e) { const c = p.cp;
  if (c && (c.type === "HDB" || c.type === "EC")) mop(p, e);
  if (p.absdRes === "FOREIGNER") e.notes.push("Foreigners pay 60% ABSD (US, Swiss, Norwegian, Icelandic and Liechtenstein nationals may get SC treatment under FTAs; verify with IRAS).");
  if (p.keeps && p.propsAfter >= 2) e.notes.push("Buying while keeping the current home means second-property ABSD and a lower loan limit.");
}
function score(p, seg, e, status, aff) {
  if (e.status === "not_eligible") return [0, ["Not eligible"]];
  let s = 50; const why = [];
  s += { comfortable:30, stretch:5, out_of_reach:-40 }[status]; why.push(`Affordability: ${status.replace(/_/g, " ")}`);
  if (e.status === "conditional") { s -= 10; why.push("Has conditions to meet first"); }
  if (aff.absd_rate > 0) { s -= Math.trunc(aff.absd_rate * 60); why.push(`ABSD of ${Math.round(aff.absd_rate * 100)}% adds a big upfront cost`); }
  const nl = seg === "EC_NEW_LAUNCH" || seg === "PRIVATE_NEW_LAUNCH";
  if (nl && p.timeline === "immediate") { s -= 15; why.push("New launches take ~3-4 years to complete"); }
  if (!nl && p.timeline === "immediate") { s += 5; why.push("Ready to move in"); }
  if (nl && p.timeline === "flexible") { s += 5; why.push("Progressive payments ease cash flow during construction"); }
  if (seg === "EC_NEW_LAUNCH") { s += 10; why.push("Condo living below private prices; becomes private after 10 years"); }
  if (seg === "HDB_RESALE" && p.income <= R.HDB_INC_CEIL && p.hasSC) { s += 5; why.push("Grants or an HDB loan may apply"); }
  if (p.purpose === "investment" && (seg === "PRIVATE_RESALE" || seg === "PRIVATE_NEW_LAUNCH")) { s += 10; why.push("Can be rented out with no occupancy rules"); }
  if (seg === "LANDED" && status === "comfortable") { s += 5; why.push("Scarce land supply tends to hold value"); }
  return [Math.max(0, Math.min(100, s)), why];
}
function analyse(input) {
  const p = makeProfile(input), fu = funds(p), out = [];
  for (const seg of Object.keys(CHECKS)) {
    const e = CHECKS[seg](p), band = R.BANDS[seg], aff = maxPrice(p, seg, fu);
    const status = aff.max_price >= band.typical ? "comfortable" : aff.max_price >= band.entry ? "stretch" : "out_of_reach";
    const [sc, why] = score(p, seg, e, status, aff);
    const target = Math.min(aff.max_price, band.typical), loanT = Math.min(target * aff.ltv, aff.max_loan_by_income);
    const ok = e.status !== "not_eligible";
    out.push({ segment:seg, label:LABELS[seg], eligibility:e.status, eligibility_reasons:e.reasons, notes:e.notes, price_band:band,
      max_affordable_price:aff, affordability: ok ? status : "n/a",
      illustrative_purchase: ok && status !== "out_of_reach" ? { price:Math.round(target), loan:Math.round(loanT), monthly_instalment:Math.round(instalment(loanT, R.MARKET_RATE, aff.tenure_years)), assumed_rate:R.MARKET_RATE } : null,
      suitability_score:sc, score_factors:why });
  }
  out.sort((a, b) => b.suitability_score - a.suitability_score);
  const viable = out.filter(r => r.eligibility !== "not_eligible" && r.affordability !== "out_of_reach");
  const r = v => Math.round(v);
  return { policy_as_of:R.POLICY_AS_OF,
    client_summary:{ buyers:p.buyers, household_type:p.household, absd_treated_as:p.absdRes, property_count_after_purchase:p.propsAfter,
      housing_loans_after_purchase:p.loansAfter, monthly_income:p.income,
      funds_available:{ cpf:r(fu.cpf), cash:r(fu.cash), sale_cash_proceeds:r(fu.sale_cash_proceeds), cpf_refund_from_sale:r(fu.cpf_refund_from_sale) } },
    top_recommendation: viable.length ? viable[0].label : null, ranked_options:out,
    disclaimer:"Indicative analysis using simplified rules and assumed prices. Confirm eligibility with HDB, stamp duties with IRAS, and loan amounts with a bank In-Principle Approval." };
}

/* ================= Helpers ================= */
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString("en-SG");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
function md(text) {
  const lines = esc(text).split("\n"); let html = "", list = false;
  const inline = s => s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>");
  for (const raw of lines) {
    const line = raw.trimEnd(), li = line.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)/), h = line.match(/^#{1,4}\s+(.*)/);
    if (li) { if (!list) { html += "<ul>"; list = true; } html += `<li>${inline(li[1])}</li>`; continue; }
    if (list) { html += "</ul>"; list = false; }
    if (h) html += `<h4>${inline(h[1])}</h4>`; else if (line.trim()) html += `<p>${inline(line)}</p>`;
  }
  return html + (list ? "</ul>" : "");
}

function showTab(which) {
  const chat = which === "chat";
  $("tab-chat").setAttribute("aria-selected", chat); $("tab-quick").setAttribute("aria-selected", !chat);
  $("panel-chat").hidden = !chat; $("panel-quick").hidden = chat;
  try { localStorage.setItem("tab", which); } catch {}
}
$("tab-chat").onclick = () => showTab("chat");
$("tab-quick").onclick = () => showTab("quick");

/* ================= Quick check ================= */
function readForm() {
  const v = id => $(id).value, d = {
    residency:v("f-res"), co_applicant_residency:v("f-co") || null, household_type:v("f-co") ? v("f-hh") : "single",
    age:v("f-age"), monthly_income:v("f-inc"), existing_monthly_debt:v("f-debt"), cpf_oa_balance:v("f-cpf"), cash_savings:v("f-cash"),
    purpose:v("f-purpose"), timeline:v("f-time"),
  };
  if (v("f-ptype")) d.current_property = { type:v("f-ptype"), plan:v("f-plan"), estimated_value:v("f-val"), outstanding_loan:v("f-loan"), cpf_used_with_interest:v("f-cpfused"), years_owned:v("f-years") };
  return d;
}
function pillFor(r) {
  if (r.eligibility === "not_eligible") return `<span class="pill bad">Not eligible</span>`;
  const map = { comfortable:["ok","Comfortable"], stretch:["warn","Stretch"], out_of_reach:["bad","Over budget"] }[r.affordability];
  return (r.eligibility === "conditional" ? `<span class="pill warn">Conditions</span>` : "") + `<span class="pill ${map[0]}">${map[1]}</span>`;
}
function renderResults() {
  let rep;
  try { rep = analyse(readForm()); } catch (e) { $("results").innerHTML = `<div class="notice">${esc(e.message)}</div>`; return; }
  const s = rep.client_summary, f = s.funds_available;
  let html = `<div class="summary"><span>Budget pool: CPF <b>$${fmt(f.cpf)}</b></span><span>Cash <b>$${fmt(f.cash)}</b></span>
    <span>ABSD as <b>${s.absd_treated_as}</b>, property #<b>${s.property_count_after_purchase}</b></span>
    <span>Top pick: <b>${esc(rep.top_recommendation || "none yet")}</b></span></div>`;
  rep.ranked_options.forEach((r, i) => {
    const a = r.max_affordable_price, ip = r.illustrative_purchase, ok = r.eligibility !== "not_eligible";
    html += `<article class="option${i === 0 && ok && r.affordability !== "out_of_reach" ? " top" : ""}">
      <div class="opt-head"><h3>${r.label}</h3>${pillFor(r)}<span class="score">${r.suitability_score}/100</span></div>
      <div class="meter"><i style="width:${r.suitability_score}%"></i></div>
      ${ok ? `<div class="figs">Max price <b>~$${fmt(a.max_price)}</b> · ${a.financing === "hdb_loan" ? "HDB loan" : "bank loan"} ${Math.round(a.ltv * 100)}%, ${a.tenure_years} yrs · limited by ${a.binding_constraint}</div>
      ${ip ? `<div class="figs">At $${fmt(ip.price)}: loan $${fmt(ip.loan)}, about <b>$${fmt(ip.monthly_instalment)}/month</b> at ${(ip.assumed_rate * 100).toFixed(1)}%</div>` : ""}
      ${a.absd ? `<div class="figs">Stamp duty at max price: BSD $${fmt(a.bsd)} + ABSD <b>$${fmt(a.absd)}</b></div>` : ""}
      <div class="figs" style="color:var(--muted)">Market: ${esc(r.price_band.note)}</div>` : ""}
      ${r.eligibility_reasons.length || r.notes.length ? `<ul class="reasons">${r.eligibility_reasons.map(x => `<li class="${r.eligibility === "not_eligible" ? "block" : ""}">${esc(x)}</li>`).join("")}${r.notes.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    </article>`;
  });
  html += `<p class="disclaimer">${esc(rep.disclaimer)} Policy figures as of ${rep.policy_as_of}.</p>`;
  $("results").innerHTML = html;
}
$("qform").addEventListener("input", renderResults);
$("qform").addEventListener("submit", e => e.preventDefault());
renderResults();

/* ================= Chat ================= */
const INSTRUCTIONS = `You are a friendly, professional assistant for a Singapore property agent. You help clients work out their next move: HDB resale, new-launch EC, resale private condo, new-launch private condo, or landed.

How to work:
1. Gather details conversationally, two or three questions at a time: residency of main buyer and any co-buyer (SC / PR / foreigner) and whether they're a married couple; age; gross monthly household income and other monthly debt; combined CPF OA and cash for the purchase; whether they own a property now (type, estimated value, outstanding loan, CPF used incl. accrued interest, years owned, sell or keep); purpose (own stay or investment) and timeline (move soon or flexible). If they don't know a figure, use a reasonable estimate and say so.
2. Once you have the core facts, call analyze_property_options. Call it again whenever an assumption changes ("what if we keep the HDB?").
3. Explain in plain language: the top 1-2 options and why, a rough budget and monthly instalment, what's ruled out and why, and key conditions (MOP, wait-out periods, ABSD, income ceilings). Use calculate_stamp_duty for specific prices the client mentions.

Rules: every number about eligibility, loans, budgets or stamp duty must come from the tools, never from memory. Say this is an indicative first look and the agent will confirm with HDB, IRAS and a bank In-Principle Approval. Keep replies short and easy to read on a phone; use S$; use short bullet lists. If the client wants to go further, offer to arrange a call with the agent.

The conversation with the client follows.`;

const PROFILE_SCHEMA = { type:"object", properties:{
  residency:{ type:"string", enum:["SC","PR","FOREIGNER"], description:"Main buyer's residency" },
  co_applicant_residency:{ type:"string", enum:["SC","PR","FOREIGNER"], description:"Co-buyer's residency; omit if buying alone" },
  household_type:{ type:"string", enum:["single","married_couple","other_joint"] },
  age:{ type:"integer" }, monthly_income:{ type:"number", description:"Gross monthly household income, SGD" },
  existing_monthly_debt:{ type:"number" }, cpf_oa_balance:{ type:"number" }, cash_savings:{ type:"number" },
  current_property:{ type:"object", properties:{ type:{ type:"string", enum:["HDB","EC","PRIVATE","LANDED"] }, estimated_value:{ type:"number" }, outstanding_loan:{ type:"number" }, cpf_used_with_interest:{ type:"number" }, years_owned:{ type:"number" }, plan:{ type:"string", enum:["sell","keep"] } } },
  other_properties_count:{ type:"integer" }, purpose:{ type:"string", enum:["own_stay","investment"] }, timeline:{ type:"string", enum:["immediate","flexible"] },
  years_since_disposed_private:{ type:"number" } },
  required:["residency","age","monthly_income","cpf_oa_balance","cash_savings"] };

const TOOLS = [
  { name:"analyze_property_options",
    description:"Runs the Singapore eligibility and affordability analysis. Returns each segment ranked by suitability with eligibility reasons, max affordable price, stamp duties, an illustrative monthly instalment and notes.",
    inputSchema:PROFILE_SCHEMA,
    execute(input) { setStatus("Running the numbers…"); const rep = analyse(input); renderResultsFrom(input); return rep; } },
  { name:"calculate_stamp_duty",
    description:"Computes Buyer's Stamp Duty and ABSD for a purchase price. residency is the ABSD profile (married couples with an SC count as SC); property_count_after_purchase is 1, 2 or 3+.",
    inputSchema:{ type:"object", properties:{ price:{ type:"number" }, residency:{ type:"string", enum:["SC","PR","FOREIGNER"] }, property_count_after_purchase:{ type:"integer" } }, required:["price","residency","property_count_after_purchase"] },
    execute(i) { return stampDuty(num(i.price, "price"), res(i.residency, "residency"), Math.round(num(i.property_count_after_purchase, "property_count_after_purchase", 1))); } },
];

const GREETING = "Hi! I'll help you work out which property type suits your next move, from HDB resale to new-launch EC, condo or landed.\n\nTo start: are you a **Singapore Citizen, PR or foreigner**, and are you buying **alone or with someone**?";
const STARTERS = [
  "We're an SC married couple, 34 and 32, earning $14k a month together. We own a 4-room HDB (6 years) worth about $650k.",
  "I'm a PR, single, 38, earning $9k. No property yet, about $150k CPF and $100k cash.",
  "I'm a foreigner on an EP earning $25k a month with $900k cash. What can I buy?",
];
let turns = [], sampleFn, ctl = null, busy = false;

function addMsg(role, text) {
  const el = document.createElement("div"); el.className = `msg ${role}`;
  if (role === "bot") el.innerHTML = md(text); else el.textContent = text;
  $("thread").append(el); $("thread").scrollTop = $("thread").scrollHeight; return el;
}
let statusEl = null;
function setStatus(text) {
  if (!text) { statusEl?.remove(); statusEl = null; return; }
  if (!statusEl) { statusEl = document.createElement("div"); statusEl.className = "status"; $("thread").append(statusEl); }
  statusEl.innerHTML = `<span class="dot"></span>${esc(text)}`; $("thread").scrollTop = $("thread").scrollHeight;
}
function renderResultsFrom(input) {
  // Mirror what the chat analysed into the Quick check tab so the agent can show the breakdown.
  try {
    const set = (id, v) => { if (v != null && v !== "") $(id).value = v; };
    set("f-res", input.residency); $("f-co").value = input.co_applicant_residency || ""; set("f-hh", input.household_type === "single" ? "married_couple" : input.household_type);
    set("f-age", input.age); set("f-inc", input.monthly_income); $("f-debt").value = input.existing_monthly_debt || 0;
    $("f-cpf").value = input.cpf_oa_balance || 0; $("f-cash").value = input.cash_savings || 0; set("f-purpose", input.purpose); set("f-time", input.timeline);
    const c = input.current_property;
    $("f-ptype").value = c && c.type ? String(c.type).toUpperCase() : "";
    if (c) { set("f-plan", c.plan); $("f-val").value = c.estimated_value || 0; $("f-loan").value = c.outstanding_loan || 0; $("f-cpfused").value = c.cpf_used_with_interest || 0; $("f-years").value = c.years_owned || 0; }
    renderResults();
  } catch {}
}
function showStarters() {
  const wrap = document.createElement("div"); wrap.className = "chips"; wrap.id = "starters";
  for (const s of STARTERS) { const b = document.createElement("button"); b.className = "chip"; b.textContent = s; b.onclick = () => send(s); wrap.append(b); }
  $("thread").append(wrap);
}
const ERR = {
  not_granted:"Chat needs permission to use Claude on your account. You can still use the Quick check tab.",
  sampling_disabled:"Claude isn't available on this account. The Quick check tab still works.",
  rate_limited:"Too many messages right now. Please wait a moment and send again.",
  session_expired:"Your session has expired. Sign in to Claude again, then resend.",
  refused:"I can't help with that one. Try rephrasing.",
  tools_unavailable:"This app can't run the calculator in chat here. Use the Quick check tab instead.",
};
async function send(text) {
  text = (text ?? $("input").value).trim();
  if (!text || busy) return;
  $("starters")?.remove();
  if (!sampleFn) { addMsg("user", text); addMsg("bot", "Chat isn't available in this view. Open this page in Claude to chat, or use the **Quick check** tab, which works everywhere."); $("input").value = ""; return; }
  busy = true; $("send").disabled = true; $("stop").hidden = false; $("input").value = "";
  addMsg("user", text); turns.push({ role:"user", content:text });
  setStatus("Thinking…");
  let bubble = null; ctl = new AbortController();
  try {
    const recent = turns.slice(-30);
    const input = [{ role:"user", content:INSTRUCTIONS }, { role:"assistant", content:GREETING }, ...(recent[0].role === "assistant" ? recent.slice(1) : recent)];
    const { text: reply } = await sampleFn(input, { tools:TOOLS, signal:ctl.signal,
      onText: ({ text: t }) => { setStatus(null); if (!bubble) bubble = addMsg("bot", ""); bubble.innerHTML = md(t); $("thread").scrollTop = $("thread").scrollHeight; } });
    turns.push({ role:"assistant", content:reply });
  } catch (e) {
    setStatus(null);
    if (e && e.text && e.code !== "refused") { if (!bubble) bubble = addMsg("bot", ""); bubble.innerHTML = md(e.text); turns.push({ role:"assistant", content:e.text }); }
    else bubble?.remove();
    if (e?.code !== "cancelled") addMsg("bot", ERR[e?.code] || "Something went wrong reaching Claude. Please send your message again.");
  } finally {
    busy = false; ctl = null; $("send").disabled = false; $("stop").hidden = true; $("input").focus();
  }
}
$("send").onclick = () => send();
$("stop").onclick = () => ctl?.abort();
$("input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
$("input").addEventListener("input", e => { e.target.style.height = "auto"; e.target.style.height = Math.min(e.target.scrollHeight, 140) + "px"; });

addMsg("bot", GREETING);
showStarters();
try { if (localStorage.getItem("tab") === "quick") showTab("quick"); } catch {}
(async () => { try { sampleFn = await window.claude?.use("sample"); } catch { sampleFn = null; } })();
</script>
