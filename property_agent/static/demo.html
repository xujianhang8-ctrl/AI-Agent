<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Widget Demo</title>
<style>
  body { margin: 0; font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #14232a; background: #f4f6f6; }
  main { max-width: 680px; margin: 0 auto; padding: 48px 20px; }
  h1 { font-size: 1.8rem; margin: 0 0 8px; }
  code { background: #e3eae9; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; word-break: break-all; }
  pre { background: #14232a; color: #e6eeec; padding: 14px; border-radius: 8px; overflow-x: auto; font-size: 0.85rem; }
</style>
</head>
<body>
<main>
  <h1>Your chat widget is running</h1>
  <p>This is a demo page. Click the <b>Find your next home</b> button in the bottom-right corner to try the chat.</p>
  <p>To add it to your own website, paste this line just before <code>&lt;/body&gt;</code>:</p>
  <pre id="snippet"></pre>
</main>
<script>
  document.getElementById("snippet").textContent =
    '<script src="' + location.origin + '/widget.js" data-color="#0d6b5a" defer><\/script>';
</script>
<script src="/widget.js" defer></script>
</body>
</html>
